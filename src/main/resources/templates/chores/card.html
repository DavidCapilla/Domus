<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="chore-card(chore, status)"
     class="swipe-reveal-container relative overflow-hidden rounded-lg flex-1 min-w-[200px]">
    <div th:attr="data-chore-id=${chore.id},data-chore-name=${chore.name},data-status=${status}"
         onclick="openDetailModal(this)"
         class="swipe-reveal-content relative z-10 bg-white card border border-gray-200 rounded-lg p-3 cursor-pointer hover:border-gray-400 hover:shadow-sm transition-shadow min-h-[6.5rem]"
         role="button" tabindex="0">
        <div class="flex flex-col gap-2">
            <div class="flex justify-between items-center">
                <span th:if="${status == 'overdue'}"
                      class="text-xs font-medium text-red-700 bg-red-100 px-2 py-0.5 rounded-full"
                      th:text="|${today.toEpochDay() - chore.dueDate.toEpochDay()}d overdue|">overdue N days</span>
                <span th:if="${status == 'due-today'}"
                      class="text-xs font-medium text-amber-700 bg-amber-100 px-2 py-0.5 rounded-full">today</span>
                <span th:if="${status == 'upcoming'}"
                      class="text-xs font-medium text-gray-600 bg-gray-100 px-2 py-0.5 rounded-full"
                      th:text="|In ${chore.dueDate.toEpochDay() - today.toEpochDay()}d|">in N days</span>
                <button th:attr="data-chore-id=${chore.id},data-chore-name=${chore.name}" onclick="event.stopPropagation(); confirmComplete(this)"
                        class="shrink-0 px-3 py-1 bg-green-600 text-white rounded text-sm hover:bg-green-700">Complete</button>
            </div>
            <div class="flex items-start gap-2">
                <th:block th:replace="~{chores/schedule-icon :: schedule-icon(chore=${chore})}"></th:block>
                <span class="font-semibold text-base leading-tight break-words line-clamp-2" th:text="${chore.name}">name</span>
            </div>
        </div>
    </div>
    <div class="swipe-reveal-action absolute inset-y-0 right-0 flex items-center z-0 bg-red-600 rounded-lg px-5">
        <button th:attr="data-chore-id=${chore.id},data-chore-name=${chore.name}" onclick="event.stopPropagation(); confirmDelete(this)"
                class="text-white text-sm font-medium whitespace-nowrap">Delete</button>
    </div>
</div>
</body>
</html>
