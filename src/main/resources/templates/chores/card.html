<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="chore-card(chore, status)"
     class="swipe-reveal-container relative overflow-hidden rounded-lg flex-1 min-w-[200px]">
    <div th:attr="data-chore-id=${chore.id},data-chore-name=${chore.name},data-status=${status}"
         onclick="openDetailModal(this)"
         class="swipe-reveal-content relative z-10 bg-white card border border-gray-200 rounded-lg p-3 cursor-pointer hover:border-gray-400 hover:shadow-sm transition-shadow min-h-[6.5rem]"
         role="button" tabindex="0">
        <div class="flex flex-col gap-2">
            <div class="flex justify-between items-center">
                <th:block th:replace="~{chores/status :: status(
                    chore=${chore},
                    status=${status},
                    days=${chore.dueDate.toEpochDay() - today.toEpochDay()})}">
                </th:block>
                <th:block th:replace="~{chores/actions :: complete-button(chore=${chore})}"></th:block>
            </div>
            <div class="flex items-start gap-2">
                <th:block th:replace="~{chores/schedule-icon :: schedule-icon(chore=${chore})}"></th:block>
                <span class="font-semibold text-base leading-tight break-words line-clamp-2" th:text="${chore.name}">name</span>
            </div>
        </div>
    </div>
    <th:block th:replace="~{chores/actions :: delete-button(chore=${chore})}"></th:block>
</div>
</body>
</html>
