<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="chore-card(chore, status)" th:attr="data-chore-name=${chore.name},data-status=${status}"
     onclick="openDetailModal(this)"
     class="card border border-gray-200 rounded-lg p-3 flex-1 min-w-[200px] cursor-pointer hover:border-gray-400 hover:shadow-sm transition-shadow"
     role="button" tabindex="0">
    <div class="flex items-center justify-between">
        <span class="font-semibold text-base truncate mr-2" th:text="${chore.name}">name</span>
        <span th:if="${status == 'overdue'}"
              class="shrink-0 text-xs font-medium text-red-700 bg-red-100 px-2 py-0.5 rounded-full"
              th:text="|overdue ${today.toEpochDay() - chore.dueDate.toEpochDay()} day${today.toEpochDay() - chore.dueDate.toEpochDay() == 1 ? '' : 's'}|">overdue N days</span>
        <span th:if="${status == 'due-today'}"
              class="shrink-0 text-xs font-medium text-amber-700 bg-amber-100 px-2 py-0.5 rounded-full">today</span>
        <span th:if="${status == 'upcoming'}"
              class="shrink-0 text-xs font-medium text-gray-600 bg-gray-100 px-2 py-0.5 rounded-full"
              th:text="|in ${chore.dueDate.toEpochDay() - today.toEpochDay()} day${chore.dueDate.toEpochDay() - today.toEpochDay() == 1 ? '' : 's'}|">in N days</span>
    </div>
    <button th:attr="data-chore-name=${chore.name}" onclick="event.stopPropagation(); confirmComplete(this)"
            class="mt-2 px-3 py-1 bg-green-600 text-white rounded text-sm hover:bg-green-700">Complete</button>
</div>
</body>
</html>
