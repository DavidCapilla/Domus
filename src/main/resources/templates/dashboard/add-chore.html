<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<th:block th:fragment="add-chore"
          th:replace="~{dashboard/modal :: modal(id='add-chore-modal', title='Add Chore', closeFn='closeModal', content=~{dashboard/add-chore :: form})}">
</th:block>

<form th:fragment="form" hx-post="/chores" hx-target="#chore-list" hx-swap="outerHTML"
      hx-on::after-request="closeModal(); this.reset()">
    <div class="space-y-3">
        <input type="text" name="name" placeholder="New chore" required
               class="p-2 border rounded w-full">
        <input type="date" name="dueDate" required
               class="p-2 border rounded w-full">
        <div>
            <label class="flex items-center gap-2 cursor-pointer py-1">
                <input type="radio" name="scheduleType" value="one_time" checked onclick="toggleDaysField(this)"
                       class="accent-blue-600">
                <span>One time</span>
            </label>
            <label class="flex flex-col cursor-pointer py-1">
                <div class="flex items-center gap-2">
                    <input type="radio" name="scheduleType" value="every_n_days" onclick="toggleDaysField(this)"
                           class="accent-blue-600">
                    <span>Recurrent</span>
                </div>
                <span class="recurring-days ml-6 mt-1" style="display:none">
                    <span>every</span>
                    <input type="number" name="days" value="7" min="1" disabled required
                           class="w-16 p-1 border rounded text-center">
                    <span>days</span>
                </span>
            </label>
        </div>
        <div>
            <select name="area" class="p-2 border rounded w-full text-gray-700">
                <option value="">No area</option>
                <option th:each="a : ${areas}" th:value="${a.name}" th:text="${a.displayName}"></option>
            </select>
        </div>
        <div class="flex justify-end gap-2 pt-2">
            <button type="button" onclick="closeModal()"
                    class="p-2 border rounded hover:bg-gray-100">Cancel</button>
            <button class="p-2 bg-blue-600 text-white rounded hover:bg-blue-700">Add</button>
        </div>
    </div>
</form>
</body>
</html>
