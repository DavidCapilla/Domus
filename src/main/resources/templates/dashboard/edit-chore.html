<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="edit-chore"
     th:replace="~{dashboard/modal :: modal(id='edit-chore-modal', title='Edit Chore', closeFn='closeEditModal', content=~{dashboard/edit-chore :: empty-container})}">
</div>

<div th:fragment="empty-container" id="edit-modal-content"></div>

<form th:fragment="chore-edit" class="space-y-3" th:attr="hx-put=|/chores/${chore.id}|"
      hx-target="#chore-list" hx-swap="outerHTML"
      hx-on::after-request="closeEditModal()">
    <input type="text" name="name" th:value="${chore.name}" required="required"
           class="p-2 border rounded w-full">
    <input type="date" name="dueDate" th:value="${chore.dueDate}" required="required"
           class="p-2 border rounded w-full">
    <div>
        <label class="flex items-center gap-2 cursor-pointer py-1">
            <input type="radio" name="scheduleType" value="one_time"
                   th:checked="${chore.schedule.isOneTime}"
                   onclick="toggleDaysField(this)" class="accent-blue-600">
            <span>One time</span>
        </label>
        <label class="flex flex-col cursor-pointer py-1">
            <div class="flex items-center gap-2">
                <input type="radio" name="scheduleType" value="every_n_days"
                       th:checked="${!chore.schedule.isOneTime}"
                       onclick="toggleDaysField(this)" class="accent-blue-600">
                <span>Recurrent</span>
            </div>
                <span class="recurring-days ml-6 mt-1"
                      th:style="${chore.schedule.isOneTime} ? 'display:none' : ''">
                    <span>every</span>
                    <input type="number" name="days"
                           th:value="${!chore.schedule.isOneTime ? chore.schedule.days : 7}"
                           th:disabled="${chore.schedule.isOneTime}" required
                           min="1"
                           class="w-16 p-1 border rounded text-center">
                    <span>days</span>
                </span>
            </label>
    </div>
    <div class="flex justify-end gap-2 pt-2">
        <button type="button" onclick="closeEditModal()"
                class="p-2 border rounded hover:bg-gray-100">Cancel</button>
        <button class="p-2 bg-blue-600 text-white rounded hover:bg-blue-700">Save</button>
    </div>
</form>
</body>
</html>
