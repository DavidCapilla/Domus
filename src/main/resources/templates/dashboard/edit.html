<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<div id="edit-chore-modal" th:fragment="chore-edit"
     class="fixed inset-0 z-50 flex items-center justify-center bg-black/50 hidden"
     role="dialog" aria-modal="true">
    <div class="bg-white rounded-xl shadow-xl p-6 w-full max-w-md mx-4">
        <div class="flex items-center justify-between mb-4">
            <h2 class="text-lg font-semibold">Edit Chore</h2>
            <button onclick="closeEditModal()" class="text-gray-400 hover:text-gray-600 text-xl leading-none">&#215;</button>
        </div>
        <form class="space-y-3" th:attr="hx-put=|/chores/${chore.name}|"
              hx-target="#chore-list" hx-swap="outerHTML"
              hx-on::after-request="closeEditModal()">
            <input type="text" name="newName" th:value="${chore.name}" required="required"
                   class="p-2 border rounded w-full">
            <input type="date" name="dueDate" th:value="${chore.dueDate}" required="required"
                   class="p-2 border rounded w-full">
            <div class="flex gap-4">
                <label class="inline-flex items-center gap-2 cursor-pointer">
                    <input type="radio" name="scheduleType" value="one_time"
                           th:checked="${chore.schedule.toString().startsWith('OneTime')}"
                           onchange="toggleDaysField(this)" class="accent-blue-600">
                    <span>One time</span>
                </label>
                <label class="inline-flex items-center gap-2 cursor-pointer">
                    <input type="radio" name="scheduleType" value="every_n_days"
                           th:checked="${chore.schedule.toString().startsWith('EveryNDays')}"
                           onchange="toggleDaysField(this)" class="accent-blue-600">
                    <span>Every N days</span>
                </label>
            </div>
            <input type="number" name="days"
                   th:value="${chore.schedule.toString().startsWith('EveryNDays') ? chore.schedule.days : 7}"
                   th:style="${chore.schedule.toString().startsWith('OneTime')} ? 'display:none' : 'display:block'"
                   placeholder="Every (days)" min="1"
                   th:disabled="${chore.schedule.toString().startsWith('OneTime')}"
                   class="p-2 border rounded w-full">
            <div class="flex justify-end gap-2 pt-2">
                <button type="button" onclick="closeEditModal()"
                        class="p-2 border rounded hover:bg-gray-100">Cancel</button>
                <button class="p-2 bg-blue-600 text-white rounded hover:bg-blue-700">Save</button>
            </div>
        </form>
    </div>
</div>
</body>
</html>
