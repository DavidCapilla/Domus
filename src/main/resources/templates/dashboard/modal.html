<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="modal(id, title, closeFn)">
    <div th:id="${id}" class="fixed inset-0 z-50 flex items-center justify-center bg-black/50 hidden"
         role="dialog" aria-modal="true">
        <div class="bg-white rounded-xl shadow-xl p-6 w-full max-w-md mx-4">
            <div class="flex items-center justify-between mb-4">
                <h2 class="text-lg font-semibold" th:text="${title}">title</h2>
                <button th:attr="onclick=|${closeFn}()|" class="text-gray-400 hover:text-gray-600 text-xl leading-none">&#215;</button>
            </div>
            <th:block th:replace="${content}" />
        </div>
    </div>
</div>
</body>
</html>
