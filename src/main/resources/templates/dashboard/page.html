<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Chores Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/htmx.org@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="/js/dashboard.js"></script>
    <style>
        .overdue-section .card { border-color: #c00 !important; }
        #toast { transition: opacity 0.3s ease-in-out; }
    </style>
</head>
<body class="max-w-4xl mx-auto p-4">
<div id="toast" class="hidden fixed top-4 left-1/2 -translate-x-1/2 z-[100] bg-red-600 text-white px-4 py-3 rounded-lg shadow-lg flex items-center gap-3 text-sm max-w-md w-full opacity-0">
    <span id="toast-message" class="flex-1"></span>
    <button onclick="dismissToast()" class="text-white/80 hover:text-white text-lg leading-none shrink-0">&times;</button>
</div>

<div class="flex items-center justify-between mb-4">
    <h1 class="text-2xl font-bold">Chores Dashboard</h1>
    <button onclick="openModal()"
            class="w-10 h-10 bg-blue-600 text-white text-2xl rounded-full hover:bg-blue-700 flex items-center justify-center leading-none pb-0.5">+</button>
</div>

<div th:replace="~{dashboard/add-chore :: add-chore}"></div>
<div th:replace="~{dashboard/edit-chore :: edit-chore}"></div>
<div th:replace="~{dashboard/detail-chore :: detail-modal}"></div>
<div th:replace="~{dashboard/list :: chore-list}"></div>
</body>
</html>
