<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Chores Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/htmx.org@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        .overdue-section .card { border-color: #c00 !important; }
        .overdue-section .card-name { color: #c00 !important; }
    </style>
    <script>
        function confirmDelete(btn) {
            var choreName = btn.dataset.choreName;
            Swal.fire({
                title: 'Delete chore?',
                text: 'Delete "' + choreName + '"?',
                icon: 'warning',
                showCancelButton: true,
                confirmButtonColor: '#d33',
                cancelButtonColor: '#3085d6',
                confirmButtonText: 'Yes, delete it'
            }).then(function (result) {
                if (result.isConfirmed) {
                    htmx.ajax('DELETE', '/chores/' + encodeURIComponent(choreName), {
                        target: '#chore-list',
                        swap: 'outerHTML'
                    });
                }
            });
        }

        function confirmComplete(btn) {
            var choreName = btn.dataset.choreName;
            Swal.fire({
                title: 'Complete chore?',
                text: 'Mark "' + choreName + '" as done?',
                icon: 'question',
                showCancelButton: true,
                confirmButtonColor: '#16a34a',
                cancelButtonColor: '#6b7280',
                confirmButtonText: 'Yes, complete it'
            }).then(function (result) {
                if (result.isConfirmed) {
                    htmx.ajax('POST', '/chores/' + encodeURIComponent(choreName) + '/complete', {
                        target: '#chore-list',
                        swap: 'outerHTML'
                    });
                }
            });
        }

        function toggleDaysField(selectEl) {
            var form = selectEl.closest('form');
            var field = form.querySelector('[name="days"]');
            var visible = selectEl.value === 'every_n_days';
            field.style.display = visible ? '' : 'none';
            field.disabled = !visible;
            field.required = visible;
        }

        function openModal() {
            document.getElementById('add-chore-modal').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('add-chore-modal').classList.add('hidden');
        }

        document.addEventListener('click', function (e) {
            var modal = document.getElementById('add-chore-modal');
            if (e.target === modal) closeModal();
        });
    </script>
</head>
<body class="max-w-4xl mx-auto p-4">
<div class="flex items-center justify-between mb-4">
    <h1 class="text-2xl font-bold">Chores Dashboard</h1>
    <button onclick="openModal()"
            class="w-10 h-10 bg-blue-600 text-white text-2xl rounded-full hover:bg-blue-700 flex items-center justify-center leading-none pb-0.5">+</button>
</div>

<div id="add-chore-modal" class="fixed inset-0 z-50 flex items-center justify-center bg-black/50 hidden"
     role="dialog" aria-modal="true">
    <div class="bg-white rounded-xl shadow-xl p-6 w-full max-w-md mx-4">
        <div class="flex items-center justify-between mb-4">
            <h2 class="text-lg font-semibold">Add Chore</h2>
            <button onclick="closeModal()" class="text-gray-400 hover:text-gray-600 text-xl leading-none">&times;</button>
        </div>
        <form hx-post="/chores" hx-target="#chore-list" hx-swap="outerHTML"
              hx-on::after-request="closeModal(); this.reset()">
            <div class="space-y-3">
                <input type="text" name="name" placeholder="New chore" required
                       class="p-2 border rounded w-full">
                <input type="date" name="dueDate" required
                       class="p-2 border rounded w-full">
                <select name="scheduleType" onchange="toggleDaysField(this)"
                        class="p-2 border rounded w-full">
                    <option value="one_time">One time</option>
                    <option value="every_n_days">Every N days</option>
                </select>
                <input type="number" name="days" style="display:none" placeholder="Every (days)" min="1" disabled required
                       class="p-2 border rounded w-full">
                <div class="flex justify-end gap-2 pt-2">
                    <button type="button" onclick="closeModal()"
                            class="p-2 border rounded hover:bg-gray-100">Cancel</button>
                    <button class="p-2 bg-blue-600 text-white rounded hover:bg-blue-700">Add</button>
                </div>
            </div>
        </form>
    </div>
</div>

<div id="chore-list" th:fragment="chore-list">
    <div th:if="${error}" class="text-red-600 p-2" th:text="${error}">error</div>

    <div class="flex gap-3 mb-5 flex-wrap">
        <div class="flex-1 min-w-full sm:min-w-[120px] border border-red-600 rounded-lg p-3 text-center">
            <div class="text-2xl font-bold text-red-600" th:text="${dashboard.overdue.size()}">0</div>
            <div class="text-sm text-gray-500 mt-0.5">Overdue</div>
        </div>
        <div class="flex-1 min-w-full sm:min-w-[120px] border border-gray-300 rounded-lg p-3 text-center">
            <div class="text-2xl font-bold" th:text="${dashboard.dueToday.size()}">0</div>
            <div class="text-sm text-gray-500 mt-0.5">Today</div>
        </div>
        <div class="flex-1 min-w-full sm:min-w-[120px] border border-gray-300 rounded-lg p-3 text-center">
            <div class="text-2xl font-bold" th:text="${dashboard.upcoming.size()}">0</div>
            <div class="text-sm text-gray-500 mt-0.5">Upcoming</div>
        </div>
    </div>

    <div class="mb-6 overdue-section">
        <h2 class="text-lg font-semibold mb-2">Overdue</h2>
        <div th:if="${dashboard.overdue.isEmpty()}" class="text-gray-500 italic py-2">No overdue chores</div>
        <div class="flex flex-wrap gap-3" th:if="${!dashboard.overdue.isEmpty()}">
            <th:block th:each="chore : ${dashboard.overdue}">
                <div th:replace="~{/chores/card :: chore-card(chore=${chore})}"></div>
            </th:block>
        </div>
    </div>

    <div class="mb-6">
        <h2 class="text-lg font-semibold mb-2">Due Today</h2>
        <div th:if="${dashboard.dueToday.isEmpty()}" class="text-gray-500 italic py-2">No chores due today</div>
        <div class="flex flex-wrap gap-3" th:if="${!dashboard.dueToday.isEmpty()}">
            <th:block th:each="chore : ${dashboard.dueToday}">
                <div th:replace="~{/chores/card :: chore-card(chore=${chore})}"></div>
            </th:block>
        </div>
    </div>

    <div class="mb-6">
        <h2 class="text-lg font-semibold mb-2">Upcoming</h2>
        <div th:if="${dashboard.upcoming.isEmpty()}" class="text-gray-500 italic py-2">No upcoming chores</div>
        <div class="flex flex-wrap gap-3" th:if="${!dashboard.upcoming.isEmpty()}">
            <th:block th:each="chore : ${dashboard.upcoming}">
                <div th:replace="~{/chores/card :: chore-card(chore=${chore})}"></div>
            </th:block>
        </div>
    </div>
</div>

<th:block th:remove="all">
<div id="chore-list" th:fragment="chore-edit">
    <div class="mb-6">
        <h2 class="text-lg font-semibold mb-2">Edit Chore</h2>
        <form class="flex flex-wrap gap-2" th:attr="hx-put=|/chores/${chore.name}|" hx-target="#chore-list" hx-swap="outerHTML">
            <input type="text" name="newName" th:value="${chore.name}" required
                   class="p-2 border rounded flex-1 min-w-[150px]">
            <input type="date" name="dueDate" th:value="${chore.dueDate}" required
                   class="p-2 border rounded">
            <select name="scheduleType" onchange="toggleDaysField(this)"
                    class="p-2 border rounded">
                <option value="one_time" th:selected="${chore.schedule.toString().startsWith('OneTime')}">One time</option>
                <option value="every_n_days" th:selected="${chore.schedule.toString().startsWith('EveryNDays')}">Every N days</option>
            </select>
            <input type="number" name="days"
                   th:style="${chore.schedule.toString().startsWith('OneTime')} ? 'display:none' : 'display:block'"
                   placeholder="Every (days)" min="1"
                   th:disabled="${chore.schedule.toString().startsWith('OneTime')}"
                   class="p-2 border rounded">
            <button class="p-2 bg-blue-600 text-white rounded hover:bg-blue-700">Save</button>
            <button type="button" hx-get="/chores" hx-target="#chore-list" hx-swap="outerHTML"
                    class="p-2 border rounded hover:bg-gray-100">Cancel</button>
        </form>
    </div>
</div>
</th:block>
</body>
</html>
