<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="habit-card(progress)" th:id="'habit-card-' + progress.habit.name" class="card border border-gray-300 rounded-lg p-3 flex-1 min-w-[200px]">
    <div class="flex items-start justify-between gap-2">
        <div class="min-w-0">
            <div class="font-semibold text-base truncate" th:text="${progress.habit.name}">name</div>
            <div th:if="${progress.habit.description}" class="text-gray-500 text-sm truncate" th:text="${progress.habit.description}">description</div>
        </div>
        <div class="text-sm text-gray-500 shrink-0">
            <th:block th:switch="${progress.habit.timeWindow.toString()}">
                <span th:case="'Daily'">today</span>
                <span th:case="'Weekly'">this week</span>
                <span th:case="'Monthly'">this month</span>
                <span th:case="*" th:text="|every ${progress.habit.timeWindow.days} days|">period</span>
            </th:block>
        </div>
    </div>
    <div class="mt-2">
        <div class="flex justify-between text-sm mb-1">
            <span th:text="|${progress.currentCount}/${progress.targetCount}|">0/0</span>
            <span th:classappend="${progress.currentCount >= progress.targetCount} ? 'text-green-600 font-medium' : 'text-gray-500'"
                  th:text="${#numbers.formatPercent(progress.percentage, 0, 0)}">0%</span>
        </div>
        <div class="w-full bg-gray-200 rounded-full h-2">
            <div class="h-2 rounded-full transition-all"
                 th:style="|width: ${progress.percentage * 100}%|"
                 th:classappend="${progress.currentCount >= progress.targetCount} ? 'bg-green-500' : 'bg-blue-500'">
            </div>
        </div>
    </div>
    <div class="mt-2 flex gap-1.5">
        <button th:attr="data-habit-name=${progress.habit.name}" onclick="confirmLog(this)"
                class="px-2 py-1 bg-green-600 text-white rounded text-sm hover:bg-green-700">Log</button>
        <button th:attr="hx-get=|/habits/${progress.habit.name}/edit|" hx-target="#habit-list" hx-swap="outerHTML"
                class="px-2 py-1 border rounded text-sm hover:bg-gray-100">Edit</button>
        <button th:attr="data-habit-name=${progress.habit.name}" onclick="confirmDeleteHabit(this)"
                class="px-2 py-1 bg-red-600 text-white rounded text-sm hover:bg-red-700">Delete</button>
    </div>
</div>
</body>
</html>
